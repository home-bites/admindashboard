<!DOCTYPE html>
<html class="light" lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HomeBites Admin Dashboard</title>
    <!-- Google Fonts: Inter & Geist -->
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
    <!-- Material Symbols -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    
    <!-- PWA Favicon -->
    <link rel="icon" type="image/jpeg" href="/icon.jpg" />
    <link rel="apple-touch-icon" href="/icon.jpg" />
    <!--
      Google Maps is NOT loaded here.

      This tag used to sit in the <head>, synchronous and render-blocking, on
      every page of the dashboard — orders, coupons, settings — while the only
      surface that draws a map is the delivery dashboard. It also pulled
      libraries=places,geometry,drawing, none of which any file imports.

      src/lib/googleMaps.js loads the SDK on demand instead, with
      loading=async and v=weekly, and dedupes concurrent callers. That is the
      loader LiveDeliveryMap already uses, so this tag was doing nothing except
      producing the "loaded directly without loading=async" console warning and
      hardcoding the browser key into the built HTML.

      The key lives in VITE_GOOGLE_MAPS_KEY now. Note the key is public by
      design once shipped to a browser — what protects it is the HTTP-referrer
      and API restrictions on the key itself, not its absence from this file.
    -->
    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />
  </head>
  <body class="bg-background text-on-background font-body-md text-body-md antialiased overflow-hidden">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
